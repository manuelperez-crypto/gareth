<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSF Advisors — Revisión del sitio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d1f3c; --navy2:#162d54; --gold:#c9922a; --gdk:#a9791f;
  --paper:#faf8f3; --slate:#3a4f65; --line:rgba(13,31,60,.12);
}
html{scroll-behavior:smooth}
body{
  font-family:'DM Sans',sans-serif;background:#e9e4d9;color:var(--navy);
  min-height:100vh;
}
/* ===== TOP BAR ===== */
#bar{
  position:fixed;top:0;left:0;right:0;height:56px;z-index:200;
  background:var(--navy);color:#fff;display:flex;align-items:center;
  justify-content:space-between;padding:0 clamp(1rem,3vw,2rem);
  box-shadow:0 2px 20px rgba(13,31,60,.18);
}
.bar-logo{display:flex;align-items:center;gap:0}
.bar-logo .bx{background:#fff;color:var(--navy);font-weight:700;font-size:.78rem;letter-spacing:.06em;padding:.24rem .38rem;line-height:1}
.bar-logo .tx{font-size:.78rem;letter-spacing:.2em;padding-left:.55rem;color:#fff}
.bar-mid{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5);text-align:center;flex:1}
.bar-right{display:flex;align-items:center;gap:.6rem}
#saved{font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);opacity:0;transition:opacity .3s}
#saved.show{opacity:1}
.bar-btn{
  background:var(--gold);color:#fff;border:none;cursor:pointer;
  font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.14em;
  text-transform:uppercase;padding:.55rem .9rem;white-space:nowrap;
  transition:background .2s;
}
.bar-btn:hover{background:var(--gdk)}
.bar-btn.ghost{background:none;border:1px solid rgba(255,255,255,.28);color:#fff}
.bar-btn.ghost:hover{background:rgba(255,255,255,.1)}
/* ===== PROGRESS ===== */
#prog{position:fixed;top:56px;left:0;height:3px;background:var(--gold);z-index:200;transition:width .4s ease;width:0}
/* ===== DECK ===== */
#deck{max-width:1180px;margin:0 auto;padding:88px clamp(1rem,3vw,2rem) 120px}
.slide{display:none;animation:fade .45s ease}
.slide.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
/* ===== SLIDE HEAD ===== */
.s-head{margin-bottom:1.4rem}
.s-eye{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem}
.s-eye i{font-style:normal;opacity:.5;margin-right:.4rem}
.s-title{font-family:'Cormorant Garamond',serif;font-size:clamp(1.9rem,4vw,3rem);font-weight:300;line-height:1.05;color:var(--navy)}
.s-title em{font-style:italic;color:var(--gdk)}
.s-sub{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-top:.5rem}
/* ===== GRID ===== */
.s-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.2rem,3vw,2.4rem);align-items:start}
/* ===== PREVIEW PANEL ===== */
.pv{border-radius:4px;overflow:hidden;box-shadow:0 10px 40px rgba(13,31,60,.14);border:1px solid var(--line)}
.pv-label{background:var(--navy);color:rgba(255,255,255,.6);font-family:'DM Mono',monospace;font-size:.52rem;letter-spacing:.16em;text-transform:uppercase;padding:.5rem .85rem;display:flex;align-items:center;gap:.5rem}
.pv-label::before{content:"●";color:var(--gold);font-size:.5rem}
.pv-body{padding:clamp(1.3rem,3vw,2rem)}
.pv-dark{background:var(--navy);color:#fff}
.pv-paper{background:var(--paper);color:var(--navy)}
.pv-blue{background:#eef1f6;color:var(--navy)}
.pv-eye{font-family:'DM Mono',monospace;font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:.7rem}
.pv h3{font-family:'Cormorant Garamond',serif;font-weight:300;line-height:1.1;font-size:clamp(1.4rem,2.6vw,2rem);margin-bottom:.7rem}
.pv h3 em{font-style:italic;color:var(--gold)}
.pv-dark h3 em{color:var(--gold)}
.pv-paper h3 em,.pv-blue h3 em{color:var(--gdk)}
.pv p{font-size:.8rem;line-height:1.7;color:inherit;opacity:.82;margin-bottom:.7rem}
.pv-dark p{color:rgba(255,255,255,.62);opacity:1}
.pv small{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;opacity:.55}
.pv-btns{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem}
.pv-btn{font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.12em;text-transform:uppercase;padding:.5rem .8rem;border-radius:2px}
.pv-btn.g{background:var(--gold);color:#fff}
.pv-btn.o{border:1px solid currentColor;opacity:.7}
.pv-list{list-style:none;display:flex;flex-direction:column;gap:.45rem;margin:.6rem 0}
.pv-list li{font-size:.76rem;line-height:1.4;padding-left:.9rem;position:relative;opacity:.85}
.pv-list li::before{content:"—";position:absolute;left:0;color:var(--gold)}
.pv-chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.pv-chip{font-family:'DM Mono',monospace;font-size:.46rem;letter-spacing:.1em;text-transform:uppercase;padding:.3rem .55rem;border:1px solid currentColor;border-radius:999px;opacity:.6}
.pv-imgnote{display:flex;align-items:center;gap:.5rem;font-family:'DM Mono',monospace;font-size:.5rem;letter-spacing:.1em;text-transform:uppercase;opacity:.5;padding:.6rem .8rem;border:1px dashed currentColor;border-radius:3px;margin:.6rem 0}
.pv-imgnote::before{content:"🖼";opacity:.8}
.pv-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12)}
.pv-stat{background:var(--navy);padding:1rem .8rem}
.pv-stat .n{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:300;color:var(--gold);line-height:1}
.pv-stat .l{font-family:'DM Mono',monospace;font-size:.46rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:.3rem}
.pv-photo{width:100%;display:block;border-radius:3px;border:2px solid var(--gold)}
.pv-form-field{background:rgba(13,31,60,.04);border:1px solid var(--line);border-radius:2px;padding:.55rem .7rem;font-size:.7rem;color:var(--slate);margin-bottom:.4rem}
.pv-dark .pv-form-field{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:rgba(255,255,255,.55)}
/* ===== FEEDBACK PANEL ===== */
.fb{position:sticky;top:80px}
.fb-card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:clamp(1.2rem,2.6vw,1.8rem);box-shadow:0 6px 30px rgba(13,31,60,.08)}
.fb-q{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:400;color:var(--navy);line-height:1.2;margin-bottom:.3rem}
.fb-q-sub{font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);margin-bottom:1rem}
.fb-tags{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1rem}
.tag{
  font-family:'DM Mono',monospace;font-size:.53rem;letter-spacing:.08em;
  padding:.45rem .75rem;border:1px solid var(--line);border-radius:999px;
  background:none;cursor:pointer;color:var(--slate);transition:all .18s;user-select:none;
}
.tag:hover{border-color:var(--gold)}
.tag.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tag.on.keep{background:#2f7d54;border-color:#2f7d54}
.fb-label{font-family:'DM Mono',monospace;font-size:.54rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:.5rem;display:block}
textarea.fb-input{
  width:100%;min-height:150px;resize:vertical;
  font-family:'DM Sans',sans-serif;font-size:.92rem;line-height:1.6;color:var(--navy);
  padding:.85rem 1rem;border:1px solid var(--line);border-left:3px solid var(--gold);
  border-radius:3px;background:#fdfcf9;outline:none;transition:border-color .2s;
}
textarea.fb-input:focus{border-color:var(--gold)}
textarea.fb-input::placeholder{color:#9aa7b5}
.fb-hint{font-size:.72rem;color:var(--slate);line-height:1.5;margin-top:.7rem;opacity:.8}
/* ===== FOOT NAV ===== */
#foot{
  position:fixed;bottom:0;left:0;right:0;height:60px;z-index:200;
  background:#fff;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(1rem,3vw,2rem);box-shadow:0 -2px 20px rgba(13,31,60,.06);
}
.nav-btn{
  display:flex;align-items:center;gap:.5rem;background:none;border:1px solid var(--line);
  cursor:pointer;font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--navy);padding:.65rem 1.1rem;border-radius:2px;transition:all .18s;
}
.nav-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gdk)}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.nav-btn.primary:hover:not(:disabled){background:var(--gold);border-color:var(--gold);color:#fff}
#dots{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center;max-width:60%}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);border:none;cursor:pointer;padding:0;transition:all .2s}
.dot:hover{background:var(--slate)}
.dot.on{background:var(--gold);transform:scale(1.3)}
.dot.done{background:#2f7d54}
/* ===== COVER ===== */
.cover{text-align:center;padding:clamp(2rem,6vw,4rem) 1rem}
.cover-logo{display:inline-flex;align-items:center;gap:0;margin-bottom:2rem}
.cover-logo .bx{background:var(--navy);color:#fff;font-weight:700;font-size:1.1rem;letter-spacing:.06em;padding:.35rem .5rem;line-height:1}
.cover-logo .tx{font-size:1.1rem;letter-spacing:.24em;padding-left:.7rem;color:var(--navy)}
.cover h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.4rem,6vw,4.2rem);font-weight:300;line-height:1.05;color:var(--navy);margin-bottom:1rem}
.cover h1 em{font-style:italic;color:var(--gdk)}
.cover-lead{font-size:clamp(.95rem,2vw,1.15rem);color:var(--slate);line-height:1.7;max-width:600px;margin:0 auto 2.5rem;font-weight:300}
.cover-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;max-width:760px;margin:0 auto 2.5rem;text-align:left}
.cstep{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1.3rem;box-shadow:0 6px 24px rgba(13,31,60,.06)}
.cstep .cn{font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--gold);line-height:1;margin-bottom:.5rem}
.cstep .ct{font-weight:600;font-size:.9rem;margin-bottom:.35rem;color:var(--navy)}
.cstep .cd{font-size:.78rem;color:var(--slate);line-height:1.55}
.cover-note{font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:.1em;color:var(--slate);opacity:.7;max-width:560px;margin:0 auto;line-height:1.8}
/* ===== CLOSING ===== */
.closing{text-align:center;padding:clamp(2rem,6vw,4rem) 1rem}
.closing h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.2rem,5vw,3.6rem);font-weight:300;color:var(--navy);margin-bottom:1rem;line-height:1.1}
.closing h1 em{font-style:italic;color:var(--gdk)}
.closing p{font-size:1rem;color:var(--slate);line-height:1.7;max-width:520px;margin:0 auto 2rem}
.big-btn{
  display:inline-flex;align-items:center;gap:.6rem;background:var(--gold);color:#fff;border:none;cursor:pointer;
  font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
  padding:1.1rem 2.4rem;border-radius:3px;transition:background .2s;margin:.4rem;
}
.big-btn:hover{background:var(--gdk)}
.big-btn.alt{background:none;border:1px solid var(--navy);color:var(--navy)}
.big-btn.alt:hover{background:var(--navy);color:#fff}
/* ===== RESPONSIVE ===== */
@media (max-width:820px){
  .s-grid{grid-template-columns:1fr}
  .fb{position:static}
  .bar-mid{display:none}
  .cover-steps{grid-template-columns:1fr}
  #dots{display:none}
  .pv-stats{grid-template-columns:1fr 1fr}
}
@media print{
  #bar,#foot,#prog{display:none}
  #deck{padding:0;max-width:100%}
  .slide{display:block!important;page-break-after:always;padding:1rem 0}
  .fb{position:static}
  textarea.fb-input{min-height:auto;height:auto}
}
</style>
</head>
<body>

<div id="bar">

  <div class="bar-mid" id="bar-title">Revisión del sitio web · Website Review</div>
  <div class="bar-right">
    <span id="saved">Guardado ✓</span>
    <button class="bar-btn ghost" onclick="resetAll()">Limpiar</button>
    <button class="bar-btn" onclick="exportNotes()">⬇ Descargar notas</button>

</div>
<div id="prog"></div>

<div id="deck"></div>

<div id="foot">
  <button class="nav-btn" id="prev" onclick="go(cur-1)">← Anterior</button>
  <div id="dots"></div>
  <button class="nav-btn primary" id="next" onclick="go(cur+1)">Siguiente →</button>

/* ============================================================
   BUILD SLIDES
   ============================================================ */
var STORE_KEY = "dsf-revision-v1";
var data = {};
try { data = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch(e){ data = {}; }

var deck = document.getElementById("deck");
var slides = [];

/* Cover slide */

cover.className = "slide";
cover.innerHTML =
  '<div class="cover">'
  +'<div class="cover-logo"><span class="bx">DSF</span><span class="tx">ADVISORS</span></div>'
  +'<h1>Cuéntanos qué quieres <em>en cada parte del sitio.</em></h1>'
  +'<p class="cover-lead">Revisa el sitio sección por sección. En cada una verás lo que hay ahora y podrás escribir qué te gustaría cambiar. Tus notas se guardan solas.</p>'
  +'<div class="cover-steps">'
  +'<div class="cstep"><div class="cn">1</div><div class="ct">Mira cada sección</div><div class="cd">A la izquierda ves lo que el sitio muestra hoy.</div></div>'
  +'<div class="cstep"><div class="cn">2</div><div class="ct">Escribe tus ideas</div><div class="cd">A la derecha escribe qué cambiar, o marca "Me gusta así".</div></div>'

  +'</div>'
  +'<p class="cover-note">Consejo: no necesitas escribir en inglés — escribe como quieras. Tus respuestas se guardan automáticamente en este dispositivo aunque cierres la página.</p>'
  +'</div>';
deck.appendChild(cover);
slides.push(cover);

/* Section slides */
SECTIONS.forEach(function(s, idx){
  var slide = document.createElement("div");
  slide.className = "slide";
  slide.setAttribute("data-section", s.key);
  var posNum = (idx+1 < 10 ? "0" : "") + (idx+1);

  var tags = QUICK_TAGS.map(function(t){
    var on = (data[s.key] && data[s.key].tags && data[s.key].tags.indexOf(t.id) >= 0) ? " on "+t.id : "";
    return '<button class="tag'+on+'" data-tag="'+t.id+'" onclick="toggleTag(this,\''+s.key+'\')">'+t.label+'</button>';
  }).join("");

  var saved = (data[s.key] && data[s.key].text) ? data[s.key].text.replace(/</g,"&lt;") : "";

  slide.innerHTML =
    '<div class="s-head">'
    +'<div class="s-eye"><i>'+posNum+'</i> Sección '+(idx+1)+' de '+SECTIONS.length+'</div>'

/* Closing slide */

closing.className = "slide";

  +'</div>';

/* ============================================================
   NAVIGATION
   ============================================================ */
var cur = 0;
var total = slides.length;

var dotsBox = document.getElementById("dots");
slides.forEach(function(_, i){
  var d = document.createElement("button");
  d.className = "dot";
  d.onclick = function(){ go(i); };
  dotsBox.appendChild(d);
});
var dots = dotsBox.querySelectorAll(".dot");

function sectionHasContent(key){
  return data[key] && ((data[key].text && data[key].text.trim()) || (data[key].tags && data[key].tags.length));
}

function go(n){
  if(n < 0 || n >= total) return;
  slides[cur].classList.remove("active");
  cur = n;
  slides[cur].classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
  document.getElementById("prog").style.width = ((cur)/(total-1)*100)+"%";
  document.getElementById("prev").disabled = (cur===0);
  var nb = document.getElementById("next");
  nb.textContent = (cur===total-1) ? "Terminado ✓" : "Siguiente →";
  nb.disabled = (cur===total-1);
  // update dots
  dots.forEach(function(d,i){
    d.classList.toggle("on", i===cur);
    var sec = slides[i].getAttribute("data-section");
    d.classList.toggle("done", sec && sectionHasContent(sec));
  });
  // update bar title
  var t = document.getElementById("bar-title");
  var sec = slides[cur].getAttribute("data-section");
  if(sec){
    var obj = SECTIONS.filter(function(x){return x.key===sec;})[0];
    t.textContent = obj ? (obj.titleEs+" · "+obj.titleEn) : "Revisión del sitio web";
  } else {
    t.textContent = "Revisión del sitio web · Website Review";
  }
}

document.addEventListener("keydown", function(e){
  var tag = (e.target.tagName || "").toLowerCase();
  if(tag==="textarea" || tag==="input") return;
  if(e.key==="ArrowRight" || e.key==="PageDown") go(cur+1);
  if(e.key==="ArrowLeft"  || e.key==="PageUp")   go(cur-1);
});

/* ============================================================
   SAVE / TAGS
   ============================================================ */
var saveTimer;
function persist(){
  localStorage.setItem(STORE_KEY, JSON.stringify(data));
  var s = document.getElementById("saved");
  s.classList.add("show");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ s.classList.remove("show"); }, 1200);
}
function saveText(el, key){
  if(!data[key]) data[key] = {};
  data[key].text = el.value;
  persist();
  var d = dots[slidesIndexOf(key)];
  if(d) d.classList.toggle("done", sectionHasContent(key));
}
function toggleTag(btn, key){
  if(!data[key]) data[key] = {};
  if(!data[key].tags) data[key].tags = [];
  var id = btn.getAttribute("data-tag");
  var i = data[key].tags.indexOf(id);
  if(i>=0){ data[key].tags.splice(i,1); btn.classList.remove("on", id); btn.classList.remove(id); }
  else { data[key].tags.push(id); btn.classList.add("on"); btn.classList.add(id); }
  persist();
  var d = dots[slidesIndexOf(key)];
  if(d) d.classList.toggle("done", sectionHasContent(key));
}
function slidesIndexOf(key){
  for(var i=0;i<slides.length;i++){ if(slides[i].getAttribute("data-section")===key) return i; }
  return -1;
}

/* ============================================================
   EXPORT
   ============================================================ */
var TAG_LABELS = {keep:"Me gusta así",text:"Cambiar texto",image:"Cambiar foto",color:"Cambiar colores",add:"Agregar algo",remove:"Quitar algo"};
function buildNotes(){
  var d = new Date();
  var out = "DSF ADVISORS — NOTAS DE REVISIÓN DEL SITIO WEB\n";
  out += "Fecha: " + d.toLocaleDateString("es-MX") + " " + d.toLocaleTimeString("es-MX") + "\n";
  out += "==================================================\n\n";
  var any = false;
  SECTIONS.forEach(function(s,idx){
    var e = data[s.key] || {};
    var hasTags = e.tags && e.tags.length;
    var hasText = e.text && e.text.trim();
    out += (idx+1) + ". " + s.titleEs.toUpperCase() + "  (" + s.titleEn + ")\n";
    if(hasTags){ out += "   Etiquetas: " + e.tags.map(function(t){return TAG_LABELS[t]||t;}).join(", ") + "\n"; }
    if(hasText){ out += "   Comentarios: " + e.text.trim() + "\n"; any=true; }
    else if(hasTags){ any=true; }
    else { out += "   (sin comentarios)\n"; }
    out += "\n";
  });
  if(!any) out += "\n(Todavía no has escrito ningún comentario.)\n";
  out += "==================================================\n";
  out += "Generado desde el deck de revisión de DSF Advisors.\n";
  return out;
}
function exportNotes(){
  var txt = buildNotes();
  var blob = new Blob([txt], {type:"text/plain;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "DSF-notas-revision.txt";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function copyNotes(){
  var txt = buildNotes();
  if(navigator.clipboard){
    navigator.clipboard.writeText(txt).then(function(){ alert("✓ Notas copiadas. Ya puedes pegarlas en un correo o mensaje."); });
  } else {
    var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    alert("✓ Notas copiadas.");
  }
}
function resetAll(){
  if(confirm("¿Borrar todos tus comentarios? Esto no se puede deshacer.")){
    data = {}; localStorage.removeItem(STORE_KEY); location.reload();
  }
}

/* init */
go(0);
